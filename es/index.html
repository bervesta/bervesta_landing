<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bervesta — Nuestros enlaces</title>
  <meta name="description" content="Bervesta. Encuentra nuestro proyecto MonTCG y contacta con nosotros.">

  <!-- Open Graph -->
  <meta property="og:title" content="Bervesta — Nuestros enlaces">
  <meta property="og:description" content="Bervesta. Encuentra nuestro proyecto MonTCG y contacta con nosotros.">
  <meta property="og:image" content="../images/bervesta-logo.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#e5342a">

  <link rel="alternate" hreflang="es" href="/es/">
  <link rel="alternate" hreflang="ca" href="/ca/">
  <link rel="alternate" hreflang="x-default" href="/">
  <link rel="canonical" href="/es/">

  <link rel="icon" type="image/png" href="../images/bervesta-logo-favicon.png">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <a class="lang-switch" href="../ca/" hreflang="ca" lang="ca" aria-label="Canvia a català">CA</a>

  <main class="page">

    <header class="hero">
      <h1 class="sr-only">Bervesta</h1>
      <img class="hero__logo" src="../images/bervesta-logo.png" alt="Logo de Bervesta" width="160" height="160">
      <p class="hero__tagline">Bervesta SL. Todo lo que buscas, en un solo sitio.</p>
    </header>

    <section class="links" aria-label="Nuestros enlaces">

      <a class="link-btn link-btn--montcg" href="https://montcg.bervesta.com/es" aria-label="Visitar MonTCG">
        <span class="link-btn__icon link-btn__icon--img" aria-hidden="true">
          <img src="../images/montcg-logo.png" alt="">
        </span>
        <span class="link-btn__label">MonTCG</span>
      </a>

    </section>

    <section class="about" aria-label="Sobre Bervesta">
      <h2 class="about__title">Sobre Bervesta</h2>
      <p class="about__text">
        Bervesta es la empresa detrás de nuestros proyectos online.
        Descubre MonTCG, dedicado al mundo de las cartas coleccionables (TCG),
        y contacta con nosotros para cualquier consulta.
      </p>
    </section>

    <a class="contact-btn" href="mailto:contacto@bervesta.com" aria-label="Contactar por email con Bervesta">
      <span class="contact-btn__icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="6" y="10" width="36" height="28" rx="3"/><path d="M7 13l17 13L41 13"/></svg>
      </span>
      Contáctanos
    </a>

  </main>

  <footer class="site-footer">
    <p class="site-footer__text">Bervesta SL · <span id="year"></span></p>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
